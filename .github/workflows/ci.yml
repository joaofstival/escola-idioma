name: CI

on:
  push:
    branches: [main, developer, modernizar-stack, 'feat/**', 'codex/**']
  pull_request:

jobs:
  qualidade:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # o Electron 45 embute o Node 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ui
      - run: npm run build
